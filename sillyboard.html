<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <title>Sillyboard</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" id="app-icon" href="icon-192.png" type="image/png">
    <link rel="apple-touch-icon" id="app-touch-icon" href="icon-192.png">
    <meta name="theme-color" id="app-theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Sillyboard">
    <meta name="description" content="Sillyboard - the grooviest soundboard app built for Trump, Stoats, and Dr. Yaoi">
    <style>
        :root {
            --bg-color: #000;
            --accent-color: #fff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            display: flex;
            flex-direction: column;
        }

        @property --bg-color {
            syntax: '<color>';
            inherits: true;
            initial-value: #000000;
        }

        @property --accent-color {
            syntax: '<color>';
            inherits: true;
            initial-value: #ffffff;
        }

        :root {
            transition:
                --bg-color 0.6s cubic-bezier(0.4, 0.0, 0.2, 1),
                --accent-color 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        /* ── Loading overlay ─────────────────────────────────────────────── */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading-overlay p {
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 700;
            opacity: 0.85;
            animation: pulse 1.2s ease-in-out infinite;
            text-align: center;
            padding: 0 20px;
        }

        #loading-progress {
            width: 60%;
            max-width: 300px;
            height: 6px;
            background: rgba(128, 128, 128, 0.3);
            border-radius: 3px;
            overflow: hidden;
        }

        #loading-bar {
            height: 100%;
            width: 100%;
            background: var(--accent-color);
            border-radius: 3px;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.15s ease;
            will-change: transform;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        #app-frame {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            border: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <script>
        // Apply theme immediately to avoid flash
        (function () {
            const bg = localStorage.getItem('sillyboard-bg') ||
                localStorage.getItem('launcher-bg') || '#000000';
            const ac = localStorage.getItem('sillyboard-accent') ||
                localStorage.getItem('launcher-accent') || '#ffffff';
            document.documentElement.style.setProperty('--bg-color', bg);
            if (window.Android) window.Android.updateThemeColor(bg);
            document.documentElement.style.setProperty('--accent-color', ac);
        })();
    </script>

    <div id="loading-overlay" aria-live="polite" aria-label="Loading sounds">
        <p id="loading-text">Decoding sounds...</p>
        <script>
            (function() {
                var phrases = [
                    "So true, so true...",
                    "Nooeeeee",
                    "Cuddlebug found The Opioids",
                    "Absolute Cinema",
                    "Legitimately want blood",
                    "Back in the FUCKING BUILDING!",
                    "Consumption :3",
                    "What the happ is fuckening?",
                    "Dr. Yaoi ftw"
                ];
                var el = document.getElementById('loading-text');
                if (el) el.textContent = phrases[Math.floor(Math.random() * phrases.length)];
            })();
        </script>
        <div id="loading-progress">
            <div id="loading-bar"></div>
        </div>
    </div>

    <!-- The actual app runs in this iframe -->
    <iframe id="app-frame" src="silly.html" allow="autoplay; fullscreen"></iframe>

    <script>
        const loadingOverlay = document.getElementById('loading-overlay');
        const textEl = document.getElementById('loading-text');

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data) return;

            if (data.type === 'set-loading-text') {
                if (textEl) textEl.textContent = data.text;
            } else if (data.type === 'hide-loading') {
                if (loadingOverlay) {
                    loadingOverlay.classList.add('hidden');
                    setTimeout(() => { if (loadingOverlay.parentNode) loadingOverlay.remove(); }, 400);
                }
            } else if (data.type === 'set-theme') {
                document.documentElement.style.setProperty('--bg-color', data.bg);
                document.documentElement.style.setProperty('--accent-color', data.ac);
                if (window.Android) window.Android.updateThemeColor(data.bg);
                scheduleBranding(data.bg, data.ac);
            }
        });

        // ── Themed icon + manifest ────────────────────────────────────────
        // The ":3" icon is drawn in the user's accent color on their theme background,
        // and a manifest carrying those colors/icons is generated, so installing the
        // PWA gives an icon that matches the current theme.
        let brandingTimer = null;
        function scheduleBranding(bg, ac) {
            clearTimeout(brandingTimer);
            brandingTimer = setTimeout(() => applyBranding(bg, ac), 400);
        }
        function applyBranding(bg, ac) {
            const img = new Image();
            img.onload = () => {
                try {
                    const draw = (size) => {
                        const c = document.createElement('canvas');
                        c.width = c.height = size;
                        const x = c.getContext('2d');
                        x.fillStyle = bg;
                        x.fillRect(0, 0, size, size);
                        // tint the white glyph with the accent color
                        const g = document.createElement('canvas');
                        g.width = g.height = size;
                        const gx = g.getContext('2d');
                        gx.drawImage(img, 0, 0, size, size);
                        gx.globalCompositeOperation = 'source-in';
                        gx.fillStyle = ac;
                        gx.fillRect(0, 0, size, size);
                        x.drawImage(g, 0, 0);
                        return c.toDataURL('image/png');
                    };
                    const i192 = draw(192), i512 = draw(512);
                    document.getElementById('app-icon').href = i192;
                    document.getElementById('app-touch-icon').href = i192;
                    document.getElementById('app-theme-color').content = bg;
                    const base = new URL('./', location.href).href;
                    const manifest = {
                        id: base + 'sillyboard.html',
                        name: 'Sillyboard', short_name: 'Sillyboard',
                        description: 'The grooviest soundboard app',
                        start_url: base + 'sillyboard.html', scope: base,
                        display: 'standalone', background_color: bg, theme_color: bg,
                        icons: [
                            { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
                            { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
                        ]
                    };
                    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
                    const link = document.querySelector('link[rel="manifest"]');
                    const old = link.href;
                    link.href = url;
                    if (old.startsWith('blob:')) URL.revokeObjectURL(old);
                } catch (e) { /* keep the static icons */ }
            };
            img.src = 'icon-glyph.png';
        }
        (function () {
            const bg = localStorage.getItem('sillyboard-bg') || localStorage.getItem('launcher-bg') || '#000000';
            const ac = localStorage.getItem('sillyboard-accent') || localStorage.getItem('launcher-accent') || '#ffffff';
            scheduleBranding(bg, ac);
        })();

        // Safety fallback — hide after 15s no matter what
        setTimeout(() => {
            if (loadingOverlay && loadingOverlay.parentNode) {
                loadingOverlay.classList.add('hidden');
                setTimeout(() => { if (loadingOverlay.parentNode) loadingOverlay.remove(); }, 450);
            }
        }, 15000);

        // ── Service Worker registration & Self Caching ────────────────────
        // The UI is served from cache. sw.js checks the cloud copy in the background
        // and, only if it differs, swaps the cache and tells us to reload.
        if ('serviceWorker' in navigator) {
            const hadController = !!navigator.serviceWorker.controller;
            navigator.serviceWorker.addEventListener('message', (e) => {
                if (e.data && e.data.type === 'ui-updated' && hadController) location.reload();
            });
            navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => { });
        }
    </script>
</body>
</html>
